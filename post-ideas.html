    body {
      margin: 0;

      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .lead {
      margin: 0;
      color: #d7e2ec;
      font-size: 14px;
    }
    .tools {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 10px 12px;
      background: rgba(246, 248, 251, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 16px;
      background: #fff;
      color: var(--ink);
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .tab {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .tab.active {
      border-color: #0f2b43;
      background: #0f2b43;
      color: #fff;
    }
    main {
      padding: 14px 12px 40px;
      max-width: 720px;
      margin: 0 auto;
    }
    .count {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .card {
      margin: 0 0 10px;
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .category {
      color: var(--gold);
    }
    .text {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0;
    }
    .bg {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .copy {
      width: 100%;
      height: 40px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
    }
    .empty {
      padding: 24px 14px;
      color: var(--muted);
      text-align: center;
    }
  </style>

    let activeCategory = "すべて";
    const categories = ["すべて", ...Array.from(new Set(items.map(item => item[1])))];
    const tabs = document.getElementById("tabs");
    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const search = document.getElementById("search");

    function renderTabs() {
      tabs.innerHTML = "";
      categories.forEach(category => {
        const button = document.createElement("button");
        button.className = "tab" + (category === activeCategory ? " active" : "");
        button.textContent = category;
        button.onclick = () => {
          activeCategory = category;
          render();
        };
        tabs.appendChild(button);
      });
    }

    function copyText(text, button) {
      navigator.clipboard.writeText(text).then(() => {
        const old = button.textContent;
        button.textContent = "コピーしました";
        setTimeout(() => button.textContent = old, 1200);
      });
    }

    function render() {
      renderTabs();
      const keyword = search.value.trim();
      const filtered = items.filter(item => {
        const categoryOk = activeCategory === "すべて" || item[1] === activeCategory;
        const keywordOk = !keyword || `${item[1]} ${item[2]} ${item[3]}`.includes(keyword);
        return categoryOk && keywordOk;
      });
      count.textContent = `${filtered.length}本表示`;
      list.innerHTML = "";
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">該当するネタがありません。</div>';
        return;
      }
      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="meta"><span>No.${item[0]}</span><span class="category">${item[1]}</span></div>
          <p class="text">${item[2]}</p>
          <p class="bg">背景案：${item[3]}</p>
          <button class="copy" type="button">投稿文をコピー</button>
        `;
        card.querySelector("button").onclick = (event) => copyText(item[2], event.currentTarget);
        list.appendChild(card);
      });
    }

    search.addEventListener("input", render);
    render();
  </script>
