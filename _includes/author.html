<aside class="author-card" aria-label="執筆者情報">
  <img src="{{ site.author.image | relative_url }}" alt="{{ site.author.name }}" width="88" height="88" loading="lazy" />
  <div>
    <p class="author-label">この記事の執筆者</p>
    <h2>{{ site.author.name }}</h2>
    <p class="author-role">{{ site.author.role }}</p>
    <p>{{ site.author.bio }}</p>
  </div>
</aside>
